<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<defs>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7d848b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d23b2f"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e08a12"/></marker>
</defs>
<rect width="1000" height="440" rx="14" fill="#f6f7f5"/>

<rect x="20" y="20" width="470" height="400" rx="12" fill="#fff"/>
<text x="44" y="56" font-size="19" font-weight="700" fill="#1d2125">지금: "3시 방향!"</text>
<text x="44" y="80" font-size="13" fill="#6b7177">기준이 외친 사람의 몸이라 듣는 사람마다 다르게 이해합니다</text>
<g transform="translate(150,320)">
<circle r="20" fill="#3c7048"/><text y="5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<line x1="0" y1="-24" x2="0" y2="-62" stroke="#7d848b" stroke-width="2.5" marker-end="url(#k)"/>
<text x="-14" y="-70" font-size="11" fill="#7d848b" text-anchor="end">A가 보는 쪽</text>
<rect x="24" y="-58" width="84" height="26" rx="13" fill="#1d2125"/><text x="66" y="-40" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3시 방향!</text>
</g>
<line x1="174" y1="320" x2="398" y2="320" stroke="#d23b2f" stroke-width="2.5" marker-end="url(#r)"/>
<g transform="translate(424,320)"><circle r="17" fill="#d23b2f"/><text y="5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">적</text></g>
<g transform="translate(150,190)">
<circle r="20" fill="#3c7048"/><text y="5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B</text>
<line x1="-24" y1="0" x2="-70" y2="0" stroke="#7d848b" stroke-width="2.5" marker-end="url(#k)"/>
<text x="-48" y="-12" font-size="11" fill="#7d848b" text-anchor="middle">B가 보는 쪽</text>
<line x1="0" y1="-24" x2="0" y2="-74" stroke="#e08a12" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#y)"/>
<text x="12" y="-58" font-size="12" font-weight="700" fill="#e08a12">B가 이해한 3시</text>
</g>
<text x="44" y="398" font-size="13" fill="#3a3f45">30° 단위라 100m 앞이면 좌우 폭이 약 50m입니다</text>

<rect x="510" y="20" width="470" height="400" rx="12" fill="#fff"/>
<text x="534" y="56" font-size="19" font-weight="700" fill="#1d2125">현맥: 방위각 045° 공유</text>
<text x="534" y="80" font-size="13" fill="#6b7177">받는 단말이 자기가 보는 방향을 빼서 화살표를 그립니다</text>
<g transform="translate(556,132)"><line x1="0" y1="22" x2="0" y2="-14" stroke="#1d2125" stroke-width="2"/><path d="M-6,-8L0,-20L6,-8z" fill="#1d2125"/><text y="40" font-size="13" font-weight="700" fill="#1d2125" text-anchor="middle">N</text></g>
<g transform="translate(860,140)"><circle r="17" fill="#d23b2f"/><text y="5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">적</text></g>
<g transform="translate(640,350)">
<circle r="20" fill="#3c7048"/><text y="5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<line x1="15" y1="-15" x2="200" y2="-200" stroke="#d23b2f" stroke-width="2.5" marker-end="url(#r)"/>
<text x="96" y="-128" font-size="13" font-weight="700" fill="#d23b2f" text-anchor="end">A가 겨눈 방위 045°</text>
</g>
<g transform="translate(790,340)">
<circle r="20" fill="#3c7048"/><text y="5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B</text>
<line x1="-20" y1="-12" x2="-62" y2="-36" stroke="#7d848b" stroke-width="2.5" marker-end="url(#k)"/>
<text x="0" y="40" font-size="11" fill="#7d848b" text-anchor="middle">B가 보는 쪽 300°</text>
<line x1="15" y1="-15" x2="62" y2="-62" stroke="#d23b2f" stroke-width="3" marker-end="url(#r)"/>
</g>
<g transform="translate(870,340)">
<rect x="-42" y="-34" width="84" height="62" rx="6" fill="#0b0f12"/>
<g transform="rotate(105)"><line x1="0" y1="18" x2="0" y2="-12" stroke="#fff" stroke-width="4"/><path d="M-8,-8L0,-20L8,-8z" fill="#fff"/></g>
<text y="46" font-size="11" fill="#3a3f45" text-anchor="middle">B 화면</text>
</g>
<text x="534" y="398" font-size="13" fill="#3a3f45">B 화면 화살표 = 045° − 300° = 105°, 실제 적 쪽</text>
</svg>
